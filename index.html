<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>実質時給計算</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<!-- <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> -->
<style>
  :root {
    --bg: #0e0e12; --card: #18181f; --border: #2a2a38;
    --accent: #c8f23a; --accent2: #ff6b4a;
    --text: #f0f0f5; --muted: #7a7a9a; --input-bg: #111118; --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100svh; padding: 24px 16px 48px; overflow-x: hidden; }
  body::before { content:''; position:fixed; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events:none; z-index:0; opacity:0.6; }
  .wrap { position:relative; z-index:1; max-width:420px; margin:0 auto; }
  header { margin-bottom:28px; }
  .badge { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); border:1px solid var(--accent); padding:3px 10px; border-radius:100px; margin-bottom:10px; }
  h1 { font-family:'Syne',sans-serif; font-size:28px; font-weight:800; line-height:1.15; letter-spacing:-.02em; }
  h1 span { color:var(--accent); }
  #login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; gap:24px; text-align:center; }
  #login-screen h1 { font-size:32px; }
  .login-sub { color:var(--muted); font-size:14px; line-height:1.6; }
  .google-btn { display:flex; align-items:center; gap:12px; background:#fff; color:#1a1a1a; border:none; border-radius:12px; padding:14px 24px; font-family:'Noto Sans JP',sans-serif; font-size:15px; font-weight:700; cursor:pointer; width:100%; max-width:320px; justify-content:center; transition:opacity .15s,transform .15s; box-shadow:0 4px 20px rgba(0,0,0,.3); }
  .google-btn:active { opacity:.85; transform:scale(.97); }
  .google-icon { width:20px; height:20px; }
  .user-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; padding:10px 14px; background:var(--card); border:1px solid var(--border); border-radius:12px; }
  .user-info { display:flex; align-items:center; gap:10px; }
  .user-avatar { width:28px; height:28px; border-radius:50%; background:var(--border); object-fit:cover; }
  .user-name { font-size:13px; font-weight:500; color:var(--muted); }
  .logout-btn { font-size:12px; color:var(--muted); background:none; border:1px solid var(--border); border-radius:8px; padding:5px 10px; cursor:pointer; width:auto; font-family:'Noto Sans JP',sans-serif; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:12px; animation:fadeUp .4s ease both; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  .section-label { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }
  .field { margin-bottom:14px; }
  .field:last-child { margin-bottom:0; }
  label { display:block; font-size:13px; font-weight:500; color:var(--muted); margin-bottom:6px; }
  input[type=text], input[type=number] { width:100%; background:var(--input-bg); border:1.5px solid var(--border); border-radius:10px; color:var(--text); font-family:'Noto Sans JP',sans-serif; font-size:18px; padding:14px 16px; outline:none; transition:border-color .2s,box-shadow .2s; -webkit-appearance:none; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(200,242,58,.12); }
  input::placeholder { color:#3a3a52; }
  .input-hint { font-size:11px; color:var(--muted); margin-top:5px; padding-left:2px; }
  .time-row { display:flex; gap:10px; align-items:flex-start; }
  .time-sep { color:var(--muted); font-size:20px; font-weight:700; flex-shrink:0; padding:0 2px; margin-top:36px; }
  .time-row .field { flex:1; margin-bottom:0; }

  /* サジェスト */
  .suggest-wrap { position:relative; }
  .suggest-list { position:absolute; top:100%; left:0; right:0; background:#1e1e28; border:1.5px solid var(--accent); border-top:none; border-radius:0 0 10px 10px; z-index:100; max-height:200px; overflow-y:auto; display:none; }
  .suggest-list.open { display:block; }
  .suggest-item { padding:12px 16px; font-size:15px; cursor:pointer; border-bottom:1px solid var(--border); transition:background .1s; }
  .suggest-item:last-child { border-bottom:none; }
  .suggest-item:active, .suggest-item.highlighted { background:rgba(200,242,58,.12); color:var(--accent); }
  .suggest-item .suggest-sub { font-size:11px; color:var(--muted); margin-top:2px; }

  .station-row { display:flex; gap:10px; }
  .station-row .field { flex:1; margin-bottom:0; }
  .sub-btn { width:100%; padding:12px; background:var(--border); border:1.5px solid #3a3a55; border-radius:10px; color:var(--text); font-family:'Noto Sans JP',sans-serif; font-size:13px; font-weight:700; cursor:pointer; margin-top:10px; transition:background .15s,transform .1s; }
  .sub-btn:active { transform:scale(.97); }
  .sub-btn.ok { background:rgba(200,242,58,.15); border-color:var(--accent); color:var(--accent); }
  .sub-btn.loading { opacity:.6; pointer-events:none; }
  .fare-status { font-size:12px; margin-top:6px; min-height:18px; color:var(--muted); }
  .fare-status.ok { color:var(--accent); }
  .fare-status.err { color:var(--accent2); }
  button.calc-btn { width:100%; padding:18px; border:none; border-radius:var(--radius); background:var(--accent); color:#0e0e12; font-family:'Syne',sans-serif; font-size:17px; font-weight:700; letter-spacing:.02em; cursor:pointer; margin-top:4px; transition:transform .15s,opacity .15s; box-shadow:0 4px 24px rgba(200,242,58,.18); }
  button.calc-btn:active { transform:scale(.97); opacity:.88; }
  #result { display:none; }
  #result.show { display:block; animation:fadeUp .35s ease both; }
  .result-tag { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:16px; }
  .big-number { font-family:'Syne',sans-serif; font-size:52px; font-weight:800; line-height:1; letter-spacing:-.03em; color:var(--accent); }
  .divider { height:1px; background:var(--border); margin:16px 0; }
  .stat-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; }
  .stat-label { font-size:13px; color:var(--muted); }
  .stat-value { font-size:15px; font-weight:700; color:var(--text); }
  .stat-value.warn { color:var(--accent2); }
  .err-box { background:rgba(255,107,74,.1); border:1px solid rgba(255,107,74,.3); color:var(--accent2); border-radius:10px; padding:12px 16px; font-size:14px; margin-top:10px; display:none; }
  .err-box.show { display:block; }
  /* 認証UI非表示（将来復活用にコメントアウト）
  #login-screen { display:flex; flex-direction:column; ... }
  .google-btn { ... }
  .user-bar { ... }
  */
  #main-screen { display:block; }
</style>
</head>
<body>
<div class="wrap">
  <!-- 認証UI（将来復活用）
  <div id="login-screen"> ... </div>
  <div class="user-bar"> ... </div>
  -->
  <div id="main-screen">
    <header><div class="badge">WAGE CALC</div><h1>実質<span>時給</span><br>計算ツール</h1></header>

    <div class="card">
      <div class="section-label">💴 支払い</div>
      <div class="field">
        <label>支払い総額</label>
        <input type="number" id="pay" inputmode="numeric" placeholder="例: 12000">
      </div>
    </div>

    <div class="card">
      <div class="section-label">🕐 勤務時間</div>
      <div class="time-row">
        <div class="field"><label>開始</label><input type="text" id="start" inputmode="numeric" placeholder="09:00" maxlength="5"><div class="input-hint">数字4桁 例: 0900</div></div>
        <div class="time-sep">→</div>
        <div class="field"><label>終了</label><input type="text" id="end" inputmode="numeric" placeholder="18:00" maxlength="5"><div class="input-hint">深夜跨ぎ対応</div></div>
      </div>
      <div class="field" style="margin-top:14px">
        <label>休憩時間（分）</label>
        <input type="number" id="break" inputmode="numeric" placeholder="例: 60">
      </div>
    </div>

    <div class="card">
      <div class="section-label">🚃 交通費</div>
      <div class="station-row" style="margin-bottom:10px">
        <div class="field">
          <label>出発駅</label>
          <div class="suggest-wrap">
            <input type="text" id="from-station" placeholder="例: 渋谷" autocomplete="off" oninput="showSuggest('from-station','from-list')">
            <div class="suggest-list" id="from-list"></div>
          </div>
        </div>
        <div class="field">
          <label>到着駅</label>
          <div class="suggest-wrap">
            <input type="text" id="to-station" placeholder="例: 新宿" autocomplete="off" oninput="showSuggest('to-station','to-list')">
            <div class="suggest-list" id="to-list"></div>
          </div>
        </div>
      </div>
      <div class="field" style="margin-bottom:10px">
        <label>経由駅（任意）</label>
        <div class="suggest-wrap">
          <input type="text" id="via-station" placeholder="例: 品川（省略可）" autocomplete="off" oninput="showSuggest('via-station','via-list')">
          <div class="suggest-list" id="via-list"></div>
        </div>
      </div>
      <button class="sub-btn" id="fare-btn" onclick="fetchFare()">運賃を取得</button>
      <div class="fare-status" id="fare-status"></div>
      <div class="field" style="margin-top:12px">
        <label>片道交通費（円）</label>
        <input type="number" id="transport" inputmode="numeric" placeholder="自動入力 or 手動入力">
      </div>
    </div>

    <div class="err-box" id="err"></div>
    <button class="calc-btn" onclick="calc()">計算する →</button>

    <div class="card" id="result">
      <div class="result-tag">✓ 計算結果</div>
      <div class="big-number" id="r-hourly">—</div>
      <div style="font-size:13px;color:var(--muted);margin-top:4px">実質時給（交通費込み）</div>
      <div class="divider"></div>
      <div class="stat-row"><span class="stat-label">実質拘束時間</span><span class="stat-value" id="r-hours">—</span></div>
      <div class="stat-row"><span class="stat-label">交通費（往復）</span><span class="stat-value warn" id="r-transport">—</span></div>
      <div class="stat-row"><span class="stat-label">手取り（交通費引き）</span><span class="stat-value" id="r-net">—</span></div>

      <div id="r-route-row" style="display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">経路</div>
        <div id="r-route-value" style="font-size:13px;color:var(--text);line-height:1.7"></div>
      </div>
    </div>
  </div>
</div>

// ── サジェスト ──
function showSuggest(inputId, listId) {
  const val = document.getElementById(inputId).value.trim();
  const list = document.getElementById(listId);
  if (!val) { list.classList.remove('open'); list.innerHTML=''; return; }

  // 駅名（前方一致優先）またはよみがな前方一致
  const q = val.toLowerCase();
  const matches = STATIONS.filter(s =>
    s.n.startsWith(val) || s.r.startsWith(q)
  ).slice(0, 6);

  if (!matches.length) { list.classList.remove('open'); list.innerHTML=''; return; }

  list.innerHTML = matches.map(s =>
    `<div class="suggest-item" onmousedown="pickSuggest('${inputId}','${listId}','${s.n}')">
      ${s.n}<div class="suggest-sub">${s.r}</div>
    </div>`
  ).join('');
  list.classList.add('open');
}

function pickSuggest(inputId, listId, name) {
  document.getElementById(inputId).value = name;
  const list = document.getElementById(listId);
  list.classList.remove('open');
  list.innerHTML = '';
}

// フォーカスが外れたら閉じる
document.addEventListener('click', e => {
  document.querySelectorAll('.suggest-list').forEach(l => {
    if (!l.previousElementSibling?.contains(e.target)) {
      l.classList.remove('open'); l.innerHTML='';
    }
  });
});

// ── 運賃取得（手動） ──
let lastFareRoute = null; // 結果カードに表示するために保持

async function fetchFare() {
  const from=document.getElementById('from-station').value.trim(), to=document.getElementById('to-station').value.trim();
  const via=document.getElementById('via-station').value.trim();
  const btn=document.getElementById('fare-btn'), status=document.getElementById('fare-status');
  if (!from||!to) { status.textContent='⚠ 駅名を入力してください'; status.className='fare-status err'; return; }
  btn.textContent='取得中…'; btn.className='sub-btn loading';
  try {
    let url=`${WORKER_URL}/?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`;
    if (via) url += `&via=${encodeURIComponent(via)}`;
    const r=await fetch(url);
    const d=await r.json();
    if (d.fare) {
      document.getElementById('transport').value=d.fare;
      // 路線名を挟んだルート文字列を生成
      const routeStr = buildRouteStr(d.stations, d.lines);
      lastFareRoute = routeStr;
      status.innerHTML=`✓ ${routeStr}<br><span style="color:var(--muted);font-size:11px">片道 ${d.fare.toLocaleString()}円（IC運賃）</span>`;
      status.className='fare-status ok'; btn.className='sub-btn ok';
    } else {
      status.textContent='⚠ '+(d.error||'取得失敗'); status.className='fare-status err'; btn.className='sub-btn';
      lastFareRoute = null;
    }
  } catch { status.textContent='⚠ 通信エラー'; status.className='fare-status err'; btn.className='sub-btn'; lastFareRoute=null; }
  btn.textContent='運賃を取得';
}

function buildRouteStr(stations, lines) {
  if (!stations || !stations.length) return '';
  // 全角英字を半角に変換して路線名を短くする
  const normLine = s => s.replace(/[Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  let s = stations[0];
  for (let i=0; i<(lines||[]).length; i++) {
    s += ` <span style="font-size:10px;color:var(--muted)">(${normLine(lines[i])})</span> → ${stations[i+1]||''}`;
  }
  return s;
}

// ── 時間入力 ──
function setupTimeInput(id) {
  const el=document.getElementById(id);
  el.addEventListener('input',function(){ let d=this.value.replace(/\D/g,''); if(!d.length){this.value='';return;} if(d.length>4)d=d.slice(0,4); this.value=d.length===4?d.slice(0,2)+':'+d.slice(2,4):d; });
  el.addEventListener('blur',function(){ let d=this.value.replace(/\D/g,''); if(!d.length)return; while(d.length<4)d='0'+d; this.value=d.slice(0,2)+':'+d.slice(2,4); });
}
setupTimeInput('start'); setupTimeInput('end');

// ── 計算 ──
function parseTime(s){ const p=s.split(':'); if(p.length!==2)return null; const h=parseInt(p[0],10),m=parseInt(p[1],10); if(isNaN(h)||isNaN(m)||h<0||h>23||m<0||m>59)return null; return h*60+m; }
function showErr(msg){ const e=document.getElementById('err'); e.textContent=msg; e.classList.add('show'); document.getElementById('result').classList.remove('show'); }
function hideErr(){ document.getElementById('err').classList.remove('show'); }
function calc(){
  hideErr();
  const pay=Number(document.getElementById("pay").value)||0;
  const sv=document.getElementById("start").value.trim(), ev=document.getElementById("end").value.trim();
  const brk=Number(document.getElementById("break").value)||0;
  const tr=Number(document.getElementById("transport").value)||0;
  if(!sv||!ev){showErr("⚠ 勤務時間を入力してください");return;}
  const sm=parseTime(sv), em=parseTime(ev);
  if(sm===null){showErr("⚠ 開始時間が正しくありません");return;}
  if(em===null){showErr("⚠ 終了時間が正しくありません");return;}
  let diff=em-sm; if(diff<=0)diff+=24*60; diff-=brk;
  if(diff<=0){showErr("⚠ 時間の設定を確認してください");return;}
  const wh=diff/60, rt=tr*2, rp=pay-rt, hw=rp/wh;
  const fmt=n=>Math.round(n).toLocaleString('ja-JP');
  document.getElementById("r-hourly").textContent=fmt(hw)+" 円";
  document.getElementById("r-hours").textContent=wh.toFixed(2)+" 時間";
  document.getElementById("r-transport").textContent="−"+fmt(rt)+" 円";
  document.getElementById("r-net").textContent=fmt(rp)+" 円";
  const rr=document.getElementById('r-route-row');
  if(lastFareRoute){ document.getElementById('r-route-value').innerHTML=lastFareRoute; rr.style.display='block'; } else rr.style.display='none';
  const res=document.getElementById("result"); res.classList.remove('show'); void res.offsetWidth; res.classList.add('show');
}
