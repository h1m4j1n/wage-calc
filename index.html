<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>実質時給計算</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0e0e12;
    --card: #18181f;
    --border: #2a2a38;
    --accent: #c8f23a;
    --accent2: #ff6b4a;
    --text: #f0f0f5;
    --muted: #7a7a9a;
    --input-bg: #111118;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100svh;
    padding: 24px 16px 48px;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }
  .wrap { position: relative; z-index: 1; max-width: 420px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 3px 10px;
    border-radius: 100px;
    margin-bottom: 10px;
  }
  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -.02em;
  }
  h1 span { color: var(--accent); }

  /* ログイン画面 */
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    gap: 24px;
    text-align: center;
  }
  #login-screen h1 { font-size: 32px; }
  .login-sub { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .google-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    color: #1a1a1a;
    border: none;
    border-radius: 12px;
    padding: 14px 24px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    max-width: 320px;
    justify-content: center;
    transition: opacity .15s, transform .15s;
    box-shadow: 0 4px 20px rgba(0,0,0,.3);
  }
  .google-btn:active { opacity: .85; transform: scale(.97); }
  .google-icon { width: 20px; height: 20px; }

  /* ユーザーバー */
  .user-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .user-info { display: flex; align-items: center; gap: 10px; }
  .user-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--border);
    object-fit: cover;
  }
  .user-name { font-size: 13px; font-weight: 500; color: var(--muted); }
  .logout-btn {
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
    width: auto;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 12px;
    animation: fadeUp .4s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type=text], input[type=number] {
    width: 100%;
    background: var(--input-bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 18px;
    padding: 14px 16px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    -webkit-appearance: none;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(200,242,58,.12);
  }
  input::placeholder { color: #3a3a52; }
  .input-hint { font-size: 11px; color: var(--muted); margin-top: 5px; padding-left: 2px; }
  .time-row { display: flex; gap: 10px; align-items: flex-start; }
  .time-sep { color: var(--muted); font-size: 20px; font-weight: 700; flex-shrink: 0; padding: 0 2px; margin-top: 36px; }
  .time-row .field { flex: 1; margin-bottom: 0; }

  /* 交通費 */
  .station-row { display: flex; gap: 10px; }
  .station-row .field { flex: 1; margin-bottom: 0; }
  .sub-btn {
    width: 100%;
    padding: 12px;
    background: var(--border);
    border: 1.5px solid #3a3a55;
    border-radius: 10px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    transition: background .15s, transform .1s;
  }
  .sub-btn:active { transform: scale(.97); }
  .sub-btn.ok { background: rgba(200,242,58,.15); border-color: var(--accent); color: var(--accent); }
  .sub-btn.loading { opacity: .6; pointer-events: none; }
  .fare-status { font-size: 12px; margin-top: 6px; min-height: 18px; color: var(--muted); }
  .fare-status.ok  { color: var(--accent); }
  .fare-status.err { color: var(--accent2); }

  /* 定期券リスト */
  .pass-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .pass-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--input-bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .pass-item.selected { border-color: var(--accent); background: rgba(200,242,58,.07); }
  .pass-item-left { display: flex; flex-direction: column; gap: 3px; }
  .pass-item-name { font-size: 13px; font-weight: 700; color: var(--text); }
  .pass-item-route { font-size: 11px; color: var(--muted); }
  .pass-item-right { display: flex; align-items: center; gap: 10px; }
  .pass-item-fare { font-size: 15px; font-weight: 700; color: var(--accent); }
  .pass-delete {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 2px 4px;
    width: auto;
    line-height: 1;
  }
  .pass-empty { font-size: 13px; color: var(--muted); padding: 4px 0; }

  /* 定期券追加フォーム */
  .add-pass-form {
    border-top: 1px solid var(--border);
    margin-top: 14px;
    padding-top: 14px;
    display: none;
  }
  .add-pass-form.open { display: block; }
  .add-pass-row { display: flex; gap: 8px; }
  .add-pass-row input { font-size: 14px; padding: 10px 12px; }
  .add-pass-row .field { flex: 1; margin-bottom: 0; }

  /* 計算ボタン */
  button.calc-btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #0e0e12;
    font-family: 'Syne', sans-serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
    margin-top: 4px;
    transition: transform .15s, opacity .15s;
    box-shadow: 0 4px 24px rgba(200,242,58,.18);
  }
  button.calc-btn:active { transform: scale(.97); opacity: .88; }

  /* 結果 */
  #result { display: none; }
  #result.show { display: block; animation: fadeUp .35s ease both; }
  .result-tag { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
  .big-number { font-family: 'Syne', sans-serif; font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -.03em; color: var(--accent); }
  .divider { height: 1px; background: var(--border); margin: 16px 0; }
  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
  .stat-label { font-size: 13px; color: var(--muted); }
  .stat-value { font-size: 15px; font-weight: 700; color: var(--text); }
  .stat-value.warn { color: var(--accent2); }

  .err-box {
    background: rgba(255,107,74,.1);
    border: 1px solid rgba(255,107,74,.3);
    color: var(--accent2);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    margin-top: 10px;
    display: none;
  }
  .err-box.show { display: block; }

  #main-screen { display: none; }
  #main-screen.show { display: block; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ログイン画面 -->
  <div id="login-screen">
    <div>
      <div class="badge">WAGE CALC</div>
      <h1>実質<span>時給</span><br>計算ツール</h1>
    </div>
    <p class="login-sub">定期券データを保存するために<br>Googleアカウントでログインしてください</p>
    <button class="google-btn" onclick="loginWithGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Googleでログイン
    </button>
  </div>

  <!-- メイン画面 -->
  <div id="main-screen">
    <div class="user-bar">
      <div class="user-info">
        <img class="user-avatar" id="user-avatar" src="" alt="">
        <span class="user-name" id="user-name">...</span>
      </div>
      <button class="logout-btn" onclick="logout()">ログアウト</button>
    </div>

    <header>
      <div class="badge">WAGE CALC</div>
      <h1>実質<span>時給</span><br>計算ツール</h1>
    </header>

    <div class="card">
      <div class="section-label">💴 支払い</div>
      <div class="field">
        <label>支払い総額</label>
        <input type="number" id="pay" inputmode="numeric" placeholder="例: 12000">
      </div>
    </div>

    <div class="card">
      <div class="section-label">🕐 勤務時間</div>
      <div class="time-row">
        <div class="field">
          <label>開始</label>
          <input type="text" id="start" inputmode="numeric" placeholder="09:00" maxlength="5">
          <div class="input-hint">数字4桁 例: 0900</div>
        </div>
        <div class="time-sep">→</div>
        <div class="field">
          <label>終了</label>
          <input type="text" id="end" inputmode="numeric" placeholder="18:00" maxlength="5">
          <div class="input-hint">深夜跨ぎ対応</div>
        </div>
      </div>
      <div class="field" style="margin-top:14px">
        <label>休憩時間（分）</label>
        <input type="number" id="break" inputmode="numeric" placeholder="例: 60">
      </div>
    </div>

    <div class="card">
      <div class="section-label">🚃 交通費</div>

      <!-- 定期券リスト -->
      <div id="pass-list" class="pass-list"></div>

      <!-- 定期券追加トグル -->
      <button class="sub-btn" id="add-pass-toggle" onclick="toggleAddPass()">＋ 定期券を追加</button>

      <!-- 定期券追加フォーム -->
      <div class="add-pass-form" id="add-pass-form">
        <div class="field">
          <label>名前（例: 通勤定期）</label>
          <input type="text" id="pass-name" placeholder="例: バイト定期">
        </div>
        <div class="add-pass-row" style="margin-bottom:10px">
          <div class="field">
            <label>出発駅</label>
            <input type="text" id="pass-from" placeholder="例: 渋谷">
          </div>
          <div class="field">
            <label>到着駅</label>
            <input type="text" id="pass-to" placeholder="例: 新宿">
          </div>
        </div>
        <button class="sub-btn" id="pass-fare-btn" onclick="fetchPassFare()">運賃を自動取得</button>
        <div class="fare-status" id="pass-fare-status"></div>
        <div class="field" style="margin-top:10px">
          <label>片道運賃（円）</label>
          <input type="number" id="pass-fare" inputmode="numeric" placeholder="自動入力 or 手動入力">
        </div>
        <button class="sub-btn ok" onclick="savePass()" style="margin-top:4px">保存する</button>
      </div>

      <div class="divider" style="margin:14px 0"></div>

      <!-- 手動入力 -->
      <div class="section-label" style="margin-bottom:10px">定期区間外・手動入力</div>
      <div class="station-row" style="margin-bottom:10px">
        <div class="field">
          <label>出発駅</label>
          <input type="text" id="from-station" placeholder="例: 渋谷">
        </div>
        <div class="field">
          <label>到着駅</label>
          <input type="text" id="to-station" placeholder="例: 新宿">
        </div>
      </div>
      <button class="sub-btn" id="fare-btn" onclick="fetchFare()">運賃を取得</button>
      <div class="fare-status" id="fare-status"></div>
      <div class="field" style="margin-top:12px">
        <label>片道交通費（円）</label>
        <input type="number" id="transport" inputmode="numeric" placeholder="自動入力 or 手動入力">
      </div>
    </div>

    <div class="err-box" id="err"></div>
    <button class="calc-btn" onclick="calc()">計算する →</button>

    <div class="card" id="result">
      <div class="result-tag">✓ 計算結果</div>
      <div class="big-number" id="r-hourly">—</div>
      <div style="font-size:13px;color:var(--muted);margin-top:4px">実質時給（交通費込み）</div>
      <div class="divider"></div>
      <div class="stat-row">
        <span class="stat-label">実質拘束時間</span>
        <span class="stat-value" id="r-hours">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">交通費（往復）</span>
        <span class="stat-value warn" id="r-transport">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">手取り（交通費引き）</span>
        <span class="stat-value" id="r-net">—</span>
      </div>
      <div class="stat-row" id="r-pass-row" style="display:none">
        <span class="stat-label" id="r-pass-label">定期区間</span>
        <span class="stat-value ok" id="r-pass-value" style="color:var(--accent)">—</span>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL  = "https://ystsccwainwgqdgqnfsa.supabase.co";
const SUPABASE_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzdHNjY3dhaW53Z3FkZ3FuZnNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzOTgzNzQsImV4cCI6MjA5NTk3NDM3NH0.aYEkRfMalHhB-722qPocE-5FrwPQGjNULm9af4Cwgts";
const WORKER_URL    = "https://fare-proxy.ryohashimoto1290.workers.dev";

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let passes = [];
let selectedPassId = null;

// ── 認証 ──────────────────────────────
async function loginWithGoogle() {
  await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: location.href }
  });
}
async function logout() {
  await sb.auth.signOut();
  location.reload();
}

sb.auth.onAuthStateChange(async (event, session) => {
  if (session?.user) {
    currentUser = session.user;
    showMain();
    await loadPasses();
  } else {
    currentUser = null;
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('main-screen').classList.remove('show');
  }
});

function showMain() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').classList.add('show');
  const meta = currentUser.user_metadata;
  document.getElementById('user-name').textContent = meta.full_name || meta.email || '';
  const avatar = document.getElementById('user-avatar');
  if (meta.avatar_url) { avatar.src = meta.avatar_url; avatar.style.display = 'block'; }
  else avatar.style.display = 'none';
}

// ── 定期券CRUD ────────────────────────
async function loadPasses() {
  const { data } = await sb.from('commute_passes').select('*').order('created_at');
  passes = data || [];
  renderPasses();
}

function renderPasses() {
  const list = document.getElementById('pass-list');
  if (!passes.length) {
    list.innerHTML = '<div class="pass-empty">登録済みの定期券はありません</div>';
    return;
  }
  list.innerHTML = passes.map(p => `
    <div class="pass-item ${selectedPassId === p.id ? 'selected' : ''}" onclick="selectPass('${p.id}')">
      <div class="pass-item-left">
        <div class="pass-item-name">${p.name}</div>
        <div class="pass-item-route">${p.from_station} → ${p.to_station}</div>
      </div>
      <div class="pass-item-right">
        <div class="pass-item-fare">${p.fare.toLocaleString()}円</div>
        <button class="pass-delete" onclick="deletePass(event,'${p.id}')">×</button>
      </div>
    </div>
  `).join('');
}

function selectPass(id) {
  if (selectedPassId === id) {
    selectedPassId = null;
    document.getElementById('transport').value = '';
  } else {
    selectedPassId = id;
    const p = passes.find(x => x.id === id);
    if (p) document.getElementById('transport').value = p.fare;
  }
  renderPasses();
}

async function deletePass(e, id) {
  e.stopPropagation();
  await sb.from('commute_passes').delete().eq('id', id);
  if (selectedPassId === id) { selectedPassId = null; document.getElementById('transport').value = ''; }
  await loadPasses();
}

function toggleAddPass() {
  const form = document.getElementById('add-pass-form');
  form.classList.toggle('open');
  document.getElementById('add-pass-toggle').textContent =
    form.classList.contains('open') ? '✕ キャンセル' : '＋ 定期券を追加';
}

async function fetchPassFare() {
  const from = document.getElementById('pass-from').value.trim();
  const to   = document.getElementById('pass-to').value.trim();
  const btn  = document.getElementById('pass-fare-btn');
  const status = document.getElementById('pass-fare-status');
  if (!from || !to) { status.textContent = '⚠ 駅名を入力してください'; status.className = 'fare-status err'; return; }
  btn.textContent = '取得中…'; btn.className = 'sub-btn loading';
  try {
    const res = await fetch(`${WORKER_URL}/?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
    const data = await res.json();
    if (data.fare) {
      document.getElementById('pass-fare').value = data.fare;
      status.textContent = `✓ ${from}→${to}：${data.fare.toLocaleString()}円`;
      status.className = 'fare-status ok';
    } else {
      status.textContent = '⚠ ' + (data.error || '取得失敗');
      status.className = 'fare-status err';
    }
  } catch { status.textContent = '⚠ 通信エラー'; status.className = 'fare-status err'; }
  btn.textContent = '運賃を自動取得'; btn.className = 'sub-btn';
}

async function savePass() {
  const name = document.getElementById('pass-name').value.trim();
  const from = document.getElementById('pass-from').value.trim();
  const to   = document.getElementById('pass-to').value.trim();
  const fare = parseInt(document.getElementById('pass-fare').value);
  if (!name || !from || !to || isNaN(fare)) {
    alert('すべての項目を入力してください'); return;
  }
  await sb.from('commute_passes').insert({
    user_id: currentUser.id, name, from_station: from, to_station: to, fare
  });
  // フォームリセット
  ['pass-name','pass-from','pass-to','pass-fare'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('pass-fare-status').textContent = '';
  toggleAddPass();
  await loadPasses();
}

// ── 運賃取得（手動） ─────────────────
async function fetchFare() {
  const from = document.getElementById('from-station').value.trim();
  const to   = document.getElementById('to-station').value.trim();
  const btn  = document.getElementById('fare-btn');
  const status = document.getElementById('fare-status');
  if (!from || !to) { status.textContent = '⚠ 駅名を入力してください'; status.className = 'fare-status err'; return; }
  btn.textContent = '取得中…'; btn.className = 'sub-btn loading';
  try {
    const res = await fetch(`${WORKER_URL}/?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
    const data = await res.json();
    if (data.fare) {
      document.getElementById('transport').value = data.fare;
      status.textContent = `✓ ${from}→${to}：片道 ${data.fare.toLocaleString()}円（IC運賃）`;
      status.className = 'fare-status ok';
      btn.className = 'sub-btn ok';
    } else {
      status.textContent = '⚠ ' + (data.error || '取得失敗');
      status.className = 'fare-status err';
      btn.className = 'sub-btn';
    }
  } catch { status.textContent = '⚠ 通信エラー'; status.className = 'fare-status err'; btn.className = 'sub-btn'; }
  btn.textContent = '運賃を取得';
}

// ── 時間入力 ─────────────────────────
function setupTimeInput(id) {
  const input = document.getElementById(id);
  input.addEventListener('input', function() {
    let d = this.value.replace(/\D/g,'');
    if (!d.length) { this.value=''; return; }
    if (d.length > 4) d = d.slice(0,4);
    this.value = d.length === 4 ? d.slice(0,2)+':'+d.slice(2,4) : d;
  });
  input.addEventListener('blur', function() {
    let d = this.value.replace(/\D/g,'');
    if (!d.length) return;
    while (d.length < 4) d = '0'+d;
    this.value = d.slice(0,2)+':'+d.slice(2,4);
  });
}
setupTimeInput('start');
setupTimeInput('end');

// ── 計算 ─────────────────────────────
function parseTime(str) {
  const p = str.split(':');
  if (p.length !== 2) return null;
  const h = parseInt(p[0],10), m = parseInt(p[1],10);
  if (isNaN(h)||isNaN(m)||h<0||h>23||m<0||m>59) return null;
  return h*60+m;
}
function showErr(msg) {
  const e = document.getElementById('err');
  e.textContent = msg; e.classList.add('show');
  document.getElementById('result').classList.remove('show');
}
function hideErr() { document.getElementById('err').classList.remove('show'); }

function calc() {
  hideErr();
  const pay       = Number(document.getElementById("pay").value) || 0;
  const startVal  = document.getElementById("start").value.trim();
  const endVal    = document.getElementById("end").value.trim();
  const breakMin  = Number(document.getElementById("break").value) || 0;
  const transport = Number(document.getElementById("transport").value) || 0;

  if (!startVal||!endVal) { showErr("⚠ 勤務時間を入力してください"); return; }
  const startMin = parseTime(startVal);
  const endMin   = parseTime(endVal);
  if (!startMin && startMin!==0) { showErr("⚠ 開始時間が正しくありません"); return; }
  if (!endMin   && endMin!==0)   { showErr("⚠ 終了時間が正しくありません"); return; }

  let diffMin = endMin - startMin;
  if (diffMin <= 0) diffMin += 24*60;
  diffMin -= breakMin;
  if (diffMin <= 0) { showErr("⚠ 時間の設定を確認してください"); return; }

  const workHours = diffMin / 60;
  const roundTrip = transport * 2;
  const realPay   = pay - roundTrip;
  const hourly    = realPay / workHours;
  const fmt = n => Math.round(n).toLocaleString('ja-JP');

  document.getElementById("r-hourly").textContent    = fmt(hourly) + " 円";
  document.getElementById("r-hours").textContent     = workHours.toFixed(2) + " 時間";
  document.getElementById("r-transport").textContent = "−" + fmt(roundTrip) + " 円";
  document.getElementById("r-net").textContent       = fmt(realPay) + " 円";

  // 定期券選択中なら表示
  const passRow = document.getElementById('r-pass-row');
  if (selectedPassId) {
    const p = passes.find(x => x.id === selectedPassId);
    if (p) {
      document.getElementById('r-pass-label').textContent = `定期：${p.name}`;
      document.getElementById('r-pass-value').textContent = `${p.from_station}→${p.to_station}`;
      passRow.style.display = 'flex';
    }
  } else { passRow.style.display = 'none'; }

  const res = document.getElementById("result");
  res.classList.remove('show');
  void res.offsetWidth;
  res.classList.add('show');
}
</script>
