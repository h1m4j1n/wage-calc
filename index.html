<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>実質時給計算</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e12;
    --card: #18181f;
    --border: #2a2a38;
    --accent: #c8f23a;
    --accent2: #ff6b4a;
    --text: #f0f0f5;
    --muted: #7a7a9a;
    --input-bg: #111118;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100svh;
    padding: 24px 16px 48px;
    overflow-x: hidden;
  }

  /* Background grain */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  .wrap { position: relative; z-index: 1; max-width: 420px; margin: 0 auto; }

  header { margin-bottom: 28px; }
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 3px 10px;
    border-radius: 100px;
    margin-bottom: 10px;
  }
  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -.02em;
    color: var(--text);
  }
  h1 span { color: var(--accent); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 12px;
    animation: fadeUp .4s ease both;
  }
  .card:nth-child(1) { animation-delay: .05s; }
  .card:nth-child(2) { animation-delay: .1s; }
  .card:nth-child(3) { animation-delay: .15s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    background: var(--input-bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 18px;
    padding: 14px 16px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    -webkit-appearance: none;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(200,242,58,.12);
  }
  input::placeholder { color: #3a3a52; }

  /* Time row */
  .time-row { display: flex; gap: 10px; align-items: center; }
  .time-row input { flex: 1; }
  .time-sep {
    color: var(--muted);
    font-size: 20px;
    font-weight: 700;
    flex-shrink: 0;
    padding: 0 2px;
    margin-top: 22px;
  }
  .time-row .field { flex: 1; margin-bottom: 0; }

  /* Button */
  button {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #0e0e12;
    font-family: 'Syne', sans-serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
    margin-top: 4px;
    transition: transform .15s, opacity .15s, box-shadow .15s;
    box-shadow: 0 4px 24px rgba(200,242,58,.18);
    animation: fadeUp .4s .25s ease both;
  }
  button:active { transform: scale(.97); opacity: .88; }

  /* Result card */
  #result { animation: none; }
  #result.show { display: block; animation: fadeUp .35s ease both; }
  #result { display: none; }

  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .result-tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .big-number {
    font-family: 'Syne', sans-serif;
    font-size: 52px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -.03em;
    color: var(--accent);
  }
  .big-unit { font-size: 20px; font-weight: 700; color: var(--muted); margin-left: 4px; }

  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
  }
  .stat-label { font-size: 13px; color: var(--muted); }
  .stat-value { font-size: 15px; font-weight: 700; color: var(--text); }
  .stat-value.warn { color: var(--accent2); }

  /* Error */
  .err {
    background: rgba(255,107,74,.1);
    border: 1px solid rgba(255,107,74,.3);
    color: var(--accent2);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    margin-top: 10px;
    display: none;
  }
  .err.show { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">WAGE CALC</div>
    <h1>実質<span>時給</span><br>計算ツール</h1>
  </header>

  <div class="card">
    <div class="section-label">💴 支払い</div>
    <div class="field">
      <label>支払い総額</label>
      <input type="number" id="pay" inputmode="numeric" placeholder="例: 12000">
    </div>
  </div>

  <div class="card">
    <div class="section-label">🕐 勤務時間</div>
    <div class="time-row">
      <div class="field">
        <label>開始</label>
        <input type="time" id="start">
      </div>
      <div class="time-sep">→</div>
      <div class="field">
        <label>終了</label>
        <input type="time" id="end">
      </div>
    </div>
    <div class="field" style="margin-top:14px">
      <label>休憩時間（分）</label>
      <input type="number" id="break" inputmode="numeric" placeholder="例: 60">
    </div>
  </div>

  <div class="card">
    <div class="section-label">🚃 交通費</div>
    <div class="field">
      <label>片道交通費</label>
      <input type="number" id="transport" inputmode="numeric" placeholder="例: 500">
    </div>
  </div>

  <div class="err" id="err"></div>

  <button onclick="calc()">計算する →</button>

  <div class="card" id="result">
    <div class="result-header">
      <div class="result-tag">✓ 計算結果</div>
    </div>
    <div class="big-number" id="r-hourly">—</div>
    <div style="font-size:13px;color:var(--muted);margin-top:4px">実質時給（交通費込み）</div>
    <div class="divider"></div>
    <div class="stat-row">
      <span class="stat-label">実質拘束時間</span>
      <span class="stat-value" id="r-hours">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">交通費（往復）</span>
      <span class="stat-value warn" id="r-transport">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">手取り（交通費引き）</span>
      <span class="stat-value" id="r-net">—</span>
    </div>
  </div>
</div>

<script>
function showErr(msg) {
  const e = document.getElementById('err');
  e.textContent = msg;
  e.classList.add('show');
  document.getElementById('result').classList.remove('show');
}
function hideErr() {
  document.getElementById('err').classList.remove('show');
}

function calc() {
  hideErr();
  const pay = Number(document.getElementById("pay").value) || 0;
  const start = document.getElementById("start").value;
  const end = document.getElementById("end").value;
  const breakMin = Number(document.getElementById("break").value) || 0;
  const transport = Number(document.getElementById("transport").value) || 0;

  if (!start || !end) { showErr("⚠ 勤務時間を入力してください"); return; }

  let s = new Date("1970-01-01T" + start);
  let e2 = new Date("1970-01-01T" + end);
  if (e2 <= s) e2.setDate(e2.getDate() + 1);

  let diffMin = (e2 - s) / 60000 - breakMin;
  if (diffMin <= 0) { showErr("⚠ 時間の設定を確認してください"); return; }

  const workHours = diffMin / 60;
  const roundTrip = transport * 2;
  const realPay = pay - roundTrip;
  const hourly = realPay / workHours;

  const fmt = n => Math.round(n).toLocaleString('ja-JP');

  document.getElementById("r-hourly").textContent = fmt(hourly) + " 円";
  document.getElementById("r-hours").textContent = workHours.toFixed(2) + " 時間";
  document.getElementById("r-transport").textContent = "−" + fmt(roundTrip) + " 円";
  document.getElementById("r-net").textContent = fmt(realPay) + " 円";

  const res = document.getElementById("result");
  res.classList.remove('show');
  void res.offsetWidth;
  res.classList.add('show');
}
</script>
</body>
</html>
